# BareMetalOperator with the anaconda provisioner. A live ISO booted over
# virtual media and a per host kickstart served by MAC. Nothing discovers hardware.
# Needs flux and cert-manager, see README.md.
---
apiVersion: v1
kind: Namespace
metadata:
  name: metal3-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: baremetal-operator
  namespace: metal3-system
spec:
  interval: 10m
  # Pinned to the BMO commit go.mod records, so the manifests match the operator
  # the plugin is compiled against. Move it with the module pin, not on its own.
  ref:
    commit: 1433bc0126748784a0b47287669c075917b411d5
  timeout: 60s
  url: https://github.com/metal3-io/baremetal-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: baremetal-operator-crds
  namespace: metal3-system
spec:
  force: false
  interval: 10m
  path: ./config/base/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: baremetal-operator
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: baremetal-operator
  namespace: metal3-system
spec:
  dependsOn:
  - name: baremetal-operator-crds
  force: false
  interval: 10m
  patches:
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/s3rj1k/baremetal-operator-oot-amd64:anaconda
    target:
      kind: Deployment
      name: controller-manager
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/ports
        value:
          - containerPort: 9443
            name: webhook-server
            protocol: TCP
          - containerPort: 8069
            name: metrics
            protocol: TCP
    target:
      kind: Deployment
      name: controller-manager
  - patch: |
      - op: replace
        path: /spec/dnsNames
        value:
          - baremetal-operator-webhook-service.metal3-system.svc
          - baremetal-operator-webhook-service.metal3-system.svc.cluster.local
    target:
      kind: Certificate
      name: baremetal-operator-serving-cert
  - patch: |
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: metal3-system/baremetal-operator-serving-cert
    target:
      kind: ValidatingWebhookConfiguration
      name: baremetal-operator-validating-webhook-configuration
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: anaconda-provisioner
    target:
      kind: Deployment
      name: controller-manager
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            containers:
              - name: manager
                imagePullPolicy: Always
                args:
                  - --enable-leader-election
                  - --tls-min-version=TLS13
                  - --build-preprov-image=false
                  - --metrics-addr=:8069
                  - --provisioner=anaconda
              - name: caddy
                image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
                imagePullPolicy: Always
                command:
                  - caddy
                  - run
                  - --config
                  - /etc/caddy/Caddyfile
                env:
                  - name: XDG_DATA_HOME
                    value: /tmp
                  - name: XDG_CONFIG_HOME
                    value: /tmp
                ports:
                  - containerPort: 8080
                    name: http
                    protocol: TCP
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8080
                    scheme: HTTP
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                    # Dropping ALL empties the bounding set, and the effective bit
                    # on /usr/bin/caddy turns that into an execve EPERM, not a downgrade.
                    add:
                      - NET_BIND_SERVICE
                  runAsUser: 65532
                  runAsGroup: 65532
                volumeMounts:
                  - mountPath: /shared
                    name: shared
                  - mountPath: /etc/caddy
                    name: caddy-config
                    readOnly: true
            volumes:
              - name: shared
                hostPath:
                  path: /var/lib/metal3-shared
                  type: DirectoryOrCreate
              - name: caddy-config
                configMap:
                  name: caddy
    target:
      kind: Deployment
      name: controller-manager
  path: ./config/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: baremetal-operator
  targetNamespace: metal3-system
  timeout: 5m
  wait: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anaconda-provisioner
  namespace: metal3-system
data:
  BMO_CONCURRENCY: "2"
  # Plain HTTP behind caddy. The provisioning network is the trust boundary,
  # anaconda has no credential to present when it fetches its kickstart anyway.
  ANACONDA_LISTEN_ADDR: "127.0.0.1:9080"
  ANACONDA_BASE_URL: "http://172.17.1.10:8080"
  # The install is only complete when anaconda posts to the callback.
  ANACONDA_INSTALL_TIMEOUT: "60m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
  namespace: metal3-system
data:
  Caddyfile: |
    {
      auto_https off
    }

    :8080 {
      handle /healthz {
        @notget not method GET
        respond @notget 405
        respond 200
      }
      # The only two routes the plugin serves.
      handle /callback/* {
        reverse_proxy 127.0.0.1:9080
      }
      handle /ks/* {
        reverse_proxy 127.0.0.1:9080
      }
      # Everything else is the modified Rocky ISO the builder Job wrote here.
      handle {
        file_server {
          root /shared/html
        }
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  # No dot in the name. A Job name becomes a Pod name and a hostname, and a dot
  # makes it an invalid DNS label, which kubectl warns about on every apply.
  name: rocky-iso-builder-10-2-ks1-amd64
  namespace: metal3-system
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: builder
        image: rockylinux/rockylinux:10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834
        imagePullPolicy: Always
        securityContext:
          privileged: true
          runAsUser: 0
        env:
        - name: ISO_ARCH
          value: x86_64
        - name: ISO_URL
          value: https://download.rockylinux.org/pub/rocky/10/isos/x86_64/Rocky-10.2-x86_64-boot.iso
        - name: ISO_SHA256
          value: bf3a75907948563d0c11f3d1b8546ee9216e18a3ea2dc0a67eb4c45452e210f9
        - name: KS_URL
          value: http://172.17.1.10:8080/ks/kickstart
        command:
        - /bin/bash
        - -c
        - |
          set -o errexit -o nounset -o pipefail

          out="/shared/html/rocky-10.2-${ISO_ARCH}-ks1.iso"
          if [ -f "${out}" ]; then
            echo "${out} already built"
            exit 0
          fi

          dnf install -y --setopt=install_weak_deps=False lorax xorriso isomd5sum

          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT

          curl -fsSL -o "${work}/boot.iso" "${ISO_URL}"
          echo "${ISO_SHA256}  ${work}/boot.iso" | sha256sum -c -

          mkksiso --cmdline "inst.ks=${KS_URL} inst.ks.sendmac" \
            "${work}/boot.iso" "${work}/out.iso"

          mkdir -p /shared/html
          install -m 0644 "${work}/out.iso" "${out}.tmp"
          mv "${out}.tmp" "${out}"
          echo "built ${out}"
        volumeMounts:
        - mountPath: /shared
          name: shared
      volumes:
      - name: shared
        hostPath:
          path: /var/lib/metal3-shared
          type: DirectoryOrCreate
