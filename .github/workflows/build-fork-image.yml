name: build-fork-image

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
    - 'anaconda_minimal'

jobs:
  build_oot_anaconda:
    name: Build and push out-of-tree anaconda image to GHCR
    if: github.repository != 'metal3-io/baremetal-operator'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Ahead of the image build, so a failing suite costs no build and pushes
    # nothing. GOTOOLCHAIN defaults to auto, which fetches the go.mod version.
    - name: Run tests
      run: make -C out-of-tree test

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Builds the plugin against BMO source at the pin, load tests the .so, and
    # layers it onto the published release image rather than a rebuilt operator.
    # Tagged anaconda rather than after the branch, because deploy/anaconda.yaml
    # pins that tag and a deployment reading any other one would not roll.
    - name: Build out of tree anaconda image
      run: make -C out-of-tree image
      env:
        REGISTRY: ghcr.io/${{ github.repository_owner }}
        IMG_TAG: anaconda
        ARCH: amd64

    # Ahead of the push, so an image carrying anything other than the release
    # plus our plugin never reaches GHCR. The load test only proves the .so
    # loads, this proves nothing underneath it was rebuilt or swapped.
    - name: Verify the image is the published BMO plus the plugin
      run: make -C out-of-tree verify-image
      env:
        REGISTRY: ghcr.io/${{ github.repository_owner }}
        IMG_TAG: anaconda
        ARCH: amd64

    - name: Push image
      run: make -C out-of-tree push
      env:
        REGISTRY: ghcr.io/${{ github.repository_owner }}
        IMG_TAG: anaconda
        ARCH: amd64
